<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - University Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="container">
            <a href="index.html" class="logo">University Portal</a>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="dashboard.html">My Courses</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li id="auth-status"><a href="#" id="login-logout">Login</a></li>
            </ul>
        </div>
    </nav>

    <main id="profile-page" class="container page-content">
        <section id="user-profile">
            <h1>User Profile</h1>
            <div id="profile-info">
                <p><strong>Name:</strong> <span id="user-name"></span></p>
                <p><strong>Email:</strong> <span id="user-email"></span></p>
                <p><strong>Role:</strong> <span id="user-role"></span></p>
            </div>
            <button id="logout-button" class="btn">Logout</button>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 University Portal. Inspired by MIT OpenCourseWare.</p>
        </div>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
</body>
</html>
