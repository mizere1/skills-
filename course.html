<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Detail - University Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="container">
            <a href="index.html" class="logo">University Portal</a>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="dashboard.html">My Courses</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li id="auth-status"><a href="#" id="login-logout">Login</a></li>
            </ul>
        </div>
    </nav>

    <main id="course-detail-page" class="container page-content">
        <section id="course-content">
            <h1 id="course-title">Course Title</h1>
            <p id="course-syllabus">Course syllabus will appear here.</p>

            <h2>Modules</h2>
            <div id="modules-list">
                <!-- Modules will be dynamically loaded here -->
            </div>

            <button id="upload-assignment-btn" class="btn">Upload Assignment (Simulated)</button>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 University Portal. Inspired by MIT OpenCourseWare.</p>
        </div>
    </footer>

    <!-- Firebase v11+ uses ES Modules -->
    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
