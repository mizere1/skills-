<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - University Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="container">
            <a href="index.html" class="logo">University Portal</a>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="dashboard.html">My Courses</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li id="auth-status"><a href="#" id="login-logout">Login</a></li>
            </ul>
        </div>
    </nav>

    <header id="auth-section" class="hidden">
        <div class="container">
            <h2>Login or Sign Up</h2>
            <form id="login-form" class="auth-form">
                <h3>Login</h3>
                <input type="email" id="login-email" placeholder="Email" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
            <hr>
            <form id="signup-form" class="auth-form">
                <h3>Sign Up</h3>
                <input type="text" id="signup-name" placeholder="Full Name" required>
                <input type="email" id="signup-email" placeholder="Email" required>
                <input type="password" id="signup-password" placeholder="Password" required>
                <button type="submit">Sign Up</button>
            </form>
             <p id="auth-error" class="error-message"></p>
        </div>
    </header>

    <main id="home-page" class="container page-content">
        <section id="welcome-message">
            <h1>Welcome to the University Learning Portal</h1>
            <p>Explore our courses and start your learning journey today.</p>
        </section>
        <section id="all-courses">
            <h2>Available Courses</h2>
            <div id="courses-container" class="course-list">
                <!-- Courses will be dynamically loaded here -->
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 University Portal. Inspired by MIT OpenCourseWare.</p>
        </div>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
</body>
</html>
